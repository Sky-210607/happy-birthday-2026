<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday to my Moon</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

    :root {
      --gold: #c9a227;
      --gold-bright: #e8c96a;
      --gold-dim: #8a6f1f;
      --ink: #1a1208;
      --black: #0b0806;
      --papyrus-a: #d8b979;
      --papyrus-b: #c7a45f;
      --papyrus-dark: #a9843f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #1c1509 0%, var(--black) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
    }

    .stage {
      position: relative;
      width: min(92vw, 620px);
      height: min(88vh, 800px);
    }

    /* Wooden rods with golden ends */
    .rod {
      position: absolute;
      left: 0;
      width: 100%;
      height: 34px;
      border-radius: 17px;
      background: linear-gradient(
        180deg,
        #3a2210 0%,
        #5b3818 15%,
        #7a4d21 35%,
        #5b3818 60%,
        #2c1a0b 100%
      );
      box-shadow:
        inset 0 3px 6px rgba(255, 220, 150, 0.25),
        inset 0 -4px 8px rgba(0, 0, 0, 0.6),
        0 6px 14px rgba(0, 0, 0, 0.7);
      z-index: 5;
      top: calc(50% - 17px);
    }

    .rod::before,
    .rod::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        var(--gold-bright),
        var(--gold) 45%,
        var(--gold-dim) 80%,
        #4a3a0c 100%
      );
      box-shadow:
        0 0 10px rgba(232, 201, 106, 0.5),
        inset 0 0 6px rgba(0, 0, 0, 0.4);
    }

    .rod::before { left: -13px; }
    .rod::after { right: -13px; }

    .rod-top { animation: unrollTop 2s cubic-bezier(.22, 1, .36, 1) forwards; }
    .rod-bottom { animation: unrollBottom 2s cubic-bezier(.22, 1, .36, 1) forwards; }

    @keyframes unrollTop {
      0% { top: calc(50% - 17px); }
      100% { top: 0; }
    }

    @keyframes unrollBottom {
      0% { top: calc(50% - 17px); }
      100% { top: calc(100% - 34px); }
    }

    /* Parchment body */
    .scroll-body {
      position: absolute;
      left: 0;
      width: 100%;
      top: 34px;
      bottom: 34px;
      clip-path: inset(50% 0 50% 0);
      animation: unrollBody 2s cubic-bezier(.22, 1, .36, 1) forwards;
      background:
        radial-gradient(120% 60% at 15% 10%, rgba(255, 255, 255, 0.06), transparent 40%),
        radial-gradient(120% 60% at 85% 90%, rgba(0, 0, 0, 0.15), transparent 40%),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.035) 0px, rgba(0, 0, 0, 0.035) 1px, transparent 1px, transparent 3px),
        linear-gradient(180deg, var(--papyrus-a), var(--papyrus-b) 45%, var(--papyrus-dark) 100%);
      box-shadow:
        inset 0 0 60px rgba(60, 35, 10, 0.55),
        inset 0 0 14px rgba(0, 0, 0, 0.4),
        0 0 0 2px var(--gold-dim),
        0 0 0 6px rgba(0, 0, 0, 0.5),
        0 14px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* Parchment texture */
    .scroll-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
      mix-blend-mode: multiply;
      opacity: 0.5;
      pointer-events: none;
    }

    .scroll-body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 18px 20px -14px rgba(40, 24, 8, 0.55),
        inset 0 -18px 20px -14px rgba(40, 24, 8, 0.55);
    }

    @keyframes unrollBody {
      0% { clip-path: inset(50% 0 50% 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    /* Golden ornamental frame */
    .frame {
      position: absolute;
      inset: 10px;
      border: 1.5px solid var(--gold);
      outline: 1px solid rgba(0, 0, 0, 0.3);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.7s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .frame::before,
    .frame::after,
    .frame .c2,
    .frame .c3 {
      content: "❧";
      position: absolute;
      color: var(--gold);
      font-family: 'Cinzel Decorative', serif;
      font-size: 18px;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
    }

    .frame::before { top: -11px; left: -11px; }
    .frame::after { top: -11px; right: -11px; transform: scaleX(-1); }
    .frame .c2 { bottom: -11px; left: -11px; transform: scaleY(-1); }
    .frame .c3 { bottom: -11px; right: -11px; transform: scale(-1, -1); }

    /* Fade the text at the top and bottom */
    .viewport {
      position: absolute;
      inset: 0;
      -webkit-mask-image: linear-gradient(
        180deg,
        transparent 0%,
        #000 10%,
        #000 90%,
        transparent 100%
      );
      mask-image: linear-gradient(
        180deg,
        transparent 0%,
        #000 10%,
        #000 90%,
        transparent 100%
      );
      overflow: hidden;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.7s forwards;
    }

    /* Infinite scrolling text */
    .track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 0 15%;
      animation: scrollUp 55s linear infinite;
      animation-delay: 2s;
      will-change: transform;
    }

    .track:hover { animation-play-state: paused; }

    @keyframes scrollUp {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }

    .title {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 700;
      font-size: clamp(20px, 4vw, 28px);
      color: var(--ink);
      text-align: center;
      letter-spacing: 1px;
      margin: 2.2em 0 0.6em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .title small {
      display: block;
      font-family: 'IM Fell English SC', serif;
      font-size: 0.42em;
      letter-spacing: 3px;
      color: var(--papyrus-dark);
      margin-top: 6px;
    }

    .dropcap {
      float: left;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: 3.1em;
      line-height: 0.8;
      color: var(--gold-dim);
      padding: 0.05em 0.12em 0 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .verse {
      font-family: 'EB Garamond', serif;
      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.85;
      color: var(--ink);
      text-align: justify;
      hyphens: auto;
      margin: 0 0 1.6em;
    }

    .verse i { color: var(--papyrus-dark); font-style: italic; }

    .divider {
      text-align: center;
      color: var(--gold-dim);
      font-size: 20px;
      margin: 1.4em 0;
      letter-spacing: 12px;
    }

    /* Golden glow */
    .glow {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.35);
      background: radial-gradient(
        ellipse at center,
        rgba(232, 201, 106, 0.05),
        transparent 65%
      );
      opacity: 0;
      animation: fadeIn 0.8s ease-out 1.7s forwards;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -32px;
      text-align: center;
      font-family: 'IM Fell English SC', serif;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 0.8s ease-out 2.1s forwards;
    }

    /* Navigation Links & Buttons */
    .top-left-nav {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-link {
      font-family: 'IM Fell English SC', serif;
      color: var(--gold);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .nav-link:hover { opacity: 1; }

    .memories-btn {
      font-family: 'Cinzel Decorative', serif;
      background: transparent;
      color: var(--gold-bright);
      border: 2px solid var(--gold);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(232, 201, 106, 0.2);
    }

    .memories-btn:hover {
      background: var(--gold-dim);
      color: var(--black);
      box-shadow: 0 0 20px rgba(232, 201, 106, 0.6);
    }

    @media (max-width: 480px) {
      .stage {
        width: 86vw;
        height: 78vh;
      }
      .track { padding: 0 10%; }
      .caption {
        font-size: 10px;
        letter-spacing: 1px;
      }
      .top-left-nav {
        top: 10px;
        left: 10px;
        gap: 10px;
      }
      .memories-btn {
        font-size: 12px;
        padding: 6px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rod-top,
      .rod-bottom,
      .scroll-body,
      .frame,
      .viewport,
      .glow,
      .caption {
        animation-duration: 0.01ms;
        animation-delay: 0ms;
      }
      .track { animation-duration: 100s; }
    }
  </style>
</head>

<body>
  
  <!-- Navigation buttons -->
  <div class="top-left-nav">
    <a href="loginoct.html" class="nav-link">✦ return to login ✦</a>
    <a href="memoriesoct.html" class="memories-btn">Next page</a>
  </div>

  <div class="stage">
    <div class="rod rod-top"></div>

    <div class="scroll-body">
      <div class="frame">
        <span class="c2"></span>
        <span class="c3"></span>
      </div>

      <div class="viewport">
        <div class="track" id="track"></div>
      </div>

      <div class="glow"></div>
    </div>

    <div class="rod rod-bottom"></div>

    <div class="caption">
      ◆ scroll of endless love ◆ hover to pause ◆
    </div>
  </div>

  <script>
    // The text content of your scroll
    const scrollContent = [
      {
        type: 'title',
        text: 'Happy birthday to my moon',
        sub: '22nd October'
      },
      {
        type: 'verse',
        drop: 'H',
        text: 'appiest birthday my love.. I am sorry for sending this to you late but here it is and I hope you get all the love and happiness that you deserve. I am so very grateful to have you in my life and "what did you do to me, Mokshita" for I am so in love with you that its beyond explanation..'
      },
      {
        type: 'verse',
        text: 'but whatever you did, I am glad you did hehe and.. I am very grateful to you for you always take such good care of me.. You might not realise but you do inspire me a lot like i always mention and you make me so proud..'
      },
      {
        type: 'divider',
        text: '⚜'
      },
      {
        type: 'verse',
        drop: 'Y',
        text: 'ou might feel that you\'re not capable but lemme tell you baby.. You are capable, you are worthy and chase your dreams baby, no matter what you do i will always be proud of you.. give yourself enough credits and ik life is difficult but baby, you got this mm and no matter what happens your achi would be always here for, waiting you like hachi kukka pilla hehe..'
      },
      {
        type: 'divider',
        text: '⚜'
      },
      {
        type: 'verse',
        drop: 'I',
        text: ' love you na Bangaram, i really wish the rest of the year is kinder and softer to you and i also wish 23 will be full of opportunities and happiness for you..'
      },
      {
        type: 'title',
        text: 'Once again, Happy Birthday my love..',
        sub: 'Nenu ninnu premistunna.'
      }
    ];

    function buildFragment(items) {
      const fragment = document.createDocumentFragment();

      items.forEach(item => {
        if (item.type === 'title') {
          const heading = document.createElement('div');
          heading.className = 'title';

          const titleText = document.createTextNode(item.text);
          heading.appendChild(titleText);

          if (item.sub) {
            const subtitle = document.createElement('small');
            subtitle.textContent = item.sub;
            heading.appendChild(subtitle);
          }

          fragment.appendChild(heading);

        } else if (item.type === 'divider') {
          const divider = document.createElement('div');
          divider.className = 'divider';
          divider.textContent =
            `${item.text}  ${item.text}  ${item.text}`;

          fragment.appendChild(divider);

        } else if (item.type === 'verse') {
          const paragraph = document.createElement('p');
          paragraph.className = 'verse';

          if (item.drop) {
            const dropCap = document.createElement('span');
            dropCap.className = 'dropcap';
            dropCap.textContent = item.drop;
            paragraph.appendChild(dropCap);
          }

          paragraph.appendChild(
            document.createTextNode(item.text)
          );

          fragment.appendChild(paragraph);
        }
      });

      return fragment;
    }

    const track = document.getElementById('track');

    // Duplicate the content so the animation loops seamlessly.
    track.appendChild(buildFragment(scrollContent));
    track.appendChild(buildFragment(scrollContent));
  </script>
</body>
</html>
